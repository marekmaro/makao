      // Optimistic Zero-Latency State Commit (Updates local UI in 0ms, syncs Firestore in background)
      const commitRoomState = useCallback((updater) => {
        const current = roomRef.current;
        if (!current) return null;
        const nextBase = typeof updater === 'function' ? updater(current) : updater;
        if (!nextBase) return null;

        const nextRoom = {
          ...nextBase,
          version: (current.version || 0) + 1,
          updatedAt: Date.now()
        };

        // Ref aktualizujemy od razu, żeby kolejne akcje w tej samej klatce widziały nowy stan.
        roomRef.current = nextRoom;
        setRoom(nextRoom);

        if (nextRoom.isOnline && fbReady && dbRef.current && window.__FB) {
          const fb = window.__FB;
          const roomDocRef = fb.doc(dbRef.current, 'artifacts', fb.appId, 'public', 'data', 'rooms', nextRoom.code);
          fb.setDoc(roomDocRef, nextRoom).catch(() => {});
        }

          { name: 'Bot Sowa', avatarId: 'mystic_owl', frameId: 'plum', title: 'Mądra Głowa' }
        ];

          id: uid('bot'),

        }));

        const center = el.scrollLeft + el.clientWidth / 2;
        let closest = 0;
        let best = Infinity;
        Array.from(el.children).forEach((child, idx) => {
          const dist = Math.abs(center - (child.offsetLeft + child.offsetWidth / 2));
          if (dist < best) { best = dist; closest = idx; }

        const id = gamesCatalog[closest] && gamesCatalog[closest].id;

                ? prev.players.filter(p => p.id !== playerId)

            }));

        setDemandModalCard(null);

        setRoom(null);

        setSelectedCardId(null);
        setRummySelectedIds([]);
        setSabPeekResult(null);

            u.searchParams.delete('room');
            window.history.replaceState({}, '', u.toString());
          }
        } catch (e) {}
      };

      // Invitation Share Helpers
      const getInviteLink = () => {
        try {
          const u = new URL(window.location.href);
          if (room?.code) u.searchParams.set('room', room.code);
          return u.toString();
        } catch (e) {
          return window.location.href;
        }
      };

      const handleCopyInviteLink = () => {
        const url = getInviteLink();
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('Skopiowano link zaproszenia! 🔗', 'success');
        } catch (e) {
          showToast(`Kod pokoju: ${room?.code}`, 'info');
        }
        document.body.removeChild(ta);
      };

      const handleNativeShare = async () => {
        const url = getInviteLink();
        const text = `Zagraj ze mną w ${gamesCatalog.find(g => g.id === room?.gameType)?.title || 'karty'} w Asy & Wąsy! Kod stołu: ${room?.code}`;
        if (navigator.share) {
          try {
            await navigator.share({ title: 'Asy & Wąsy', text, url });
            return;
          } catch (e) {}
        }
        handleCopyInviteLink();
      };

      // =======================================================================
      // 7. MAKAO ACTIONS (cienka warstwa nad czystym silnikiem gry)
      // =======================================================================
      const afterMakaoCommit = (updated, actorId) => {
        if (!updated?.isPassAndPlay || updated.status !== 'playing') return;
        const nextPl = updated.players[updated.makao.currentTurnIdx];
        // Zasłona „przekaż telefon” tylko wtedy, gdy ruch przechodzi na innego człowieka.
        if (nextPl && !nextPl.isBot && nextPl.id !== actorId) setPassPhoneNextPlayer(nextPl);
      };

      const executeMakaoPlayCard = (actorId, cardId, demandChoice = null) => {
        const curr = roomRef.current;
        if (!curr || curr.status !== 'playing' || !curr.makao) return;
        const res = applyMakaoPlay(curr.players, curr.makao, curr.makaoRules, actorId, cardId, demandChoice);
        if (!res) {
          if (actorId === activePlayerId) {
            SoundFX.error();
            showToast('Ta karta teraz nie pasuje', 'error');
          }
          return;
        }

        if (res.won) {
          SoundFX.win();
          commitRoomState(prev => ({
            ...prev,
            status: 'finished',
            players: prev.players.map(p => p.id === actorId ? { ...p, score: (p.score || 0) + 1 } : p),
            winnerInfo: { winnerId: actorId, winnerName: res.actor.name, reason: 'Pierwszy pozbył się wszystkich kart!' },
            makao: res.state
          }));
          return;
        }

        if (actorId === activePlayerId) SoundFX.play();
        afterMakaoCommit(commitRoomState(prev => ({ ...prev, makao: res.state })), actorId);
      };

      const executeMakaoDrawOrPass = (actorId) => {
        const curr = roomRef.current;
        if (!curr || curr.status !== 'playing' || !curr.makao) return;
        const next = applyMakaoDraw(curr.players, curr.makao, curr.makaoRules, actorId);
        if (!next) return;
        if (actorId === activePlayerId) SoundFX.draw();
        afterMakaoCommit(commitRoomState(prev => ({ ...prev, makao: next })), actorId);
      };

      // Zagranie zaznaczonych kart; as i walet pytają najpierw o żądanie
      // (chyba że to ostatnie karty z ręki — wtedy żądanie nie ma znaczenia).
      const playMakaoCards = (ids) => {
        const curr = roomRef.current;
        if (!curr?.makao || ids.length === 0) return;
        const hand = curr.makao.hands[activePlayerId] || [];
        const first = hand.find(c => c.id === ids[0]);
        if (!first) return;
        setMakaoPick([]);
        if ((first.rank === 'A' || first.rank === 'J') && ids.length < hand.length) {
          setDemandModalCard({ rank: first.rank, ids });
          return;
        }
        executeMakaoPlayCard(activePlayerId, ids, null);
      };

      const handleMakaoCardClick = (card) => {
        const curr = roomRef.current;
        if (!curr || curr.status !== 'playing' || !curr.makao) return;
        const ms = curr.makao;
        const rules = curr.makaoRules;
        if (curr.players[ms.currentTurnIdx]?.id !== activePlayerId) {
          showToast('Poczekaj na swoją kolej', 'info');
          return;
        }
        const hand = ms.hands[activePlayerId] || [];

        // Trwa zaznaczanie kilku kart tej samej figury.
        if (makaoPick.length > 0) {
          const firstPicked = hand.find(c => c.id === makaoPick[0]);
          if (makaoPick.includes(card.id)) {
            // Odznaczenie pierwszej karty kasuje cały wybór, kolejnej — tylko ją.
            setMakaoPick(card.id === makaoPick[0] ? [] : makaoPick.filter(id => id !== card.id));
            SoundFX.draw();
            return;
          }
          if (firstPicked && card.rank === firstPicked.rank) {
            setMakaoPick([...makaoPick, card.id]);
            SoundFX.inspect();
            return;
          }
          setMakaoPick([]);
        }

        if (!canPlayMakaoCard(card, ms, rules)) {
          SoundFX.error();
          showToast(ms.drawnCardId ? 'Możesz zagrać tylko dobraną kartę albo spasować' : 'Ta karta teraz nie pasuje', 'error');
          return;
        }
        // Masz więcej kart tej figury? Najpierw wybór, ile z nich idzie na stół.
        if (makaoMates(hand, card, rules).length > 0) {
          setMakaoPick([card.id]);
          SoundFX.inspect();
          return;
        }
        playMakaoCards([card.id]);
      };

      // Zaznaczenie kasujemy, gdy zmienia się tura albo stos.
      const makaoTurnKey = `${room?.makao?.currentTurnIdx}|${room?.makao?.discardPile?.length}|${room?.status}`;
      useEffect(() => { setMakaoPick([]); }, [makaoTurnKey]);

      const handleSayMakao = () => {
        const curr = roomRef.current;
        if (!curr?.makao) return;
        const next = applyMakaoSayMakao(curr.players, curr.makao, activePlayerId);
        if (!next) return;
        SoundFX.alert();
        commitRoomState(prev => ({ ...prev, makao: next }));
      };

      const handleCatchMakao = (targetId, catcherId = activePlayerId) => {
        const curr = roomRef.current;
        if (!curr?.makao || curr.status !== 'playing') return;
        const catcher = curr.players.find(p => p.id === catcherId);
        const next = applyMakaoCatch(curr.players, curr.makao, curr.makaoRules, targetId, catcher?.name || '');
        if (!next) return;
        SoundFX.alert();
        commitRoomState(prev => ({ ...prev, makao: next }));
      };

      // Limit czasu na ruch (tylko online): po czasie gracz automatycznie dobiera / pasuje.
      useEffect(() => {
        const curr = roomRef.current;
        if (!curr || !curr.isOnline || curr.status !== 'playing' || curr.gameType !== 'makao' || !curr.makao) return;
        const limit = Number(curr.makaoRules?.turnTime) || 0;
        if (limit <= 0) return;
        const turnPlayer = curr.players[curr.makao.currentTurnIdx];
        if (!turnPlayer || turnPlayer.isBot) return;
        const elapsed = (nowTick - (curr.makao.turnStartedAt || nowTick)) / 1000;
        const mine = turnPlayer.id === playerId;
        // Własny ruch kończymy sami; za nieobecnego gracza robi to gospodarz (z zapasem 5 s).
        if ((mine && elapsed >= limit) || (!mine && curr.hostId === playerId && elapsed >= limit + 5)) {
          if (mine) {
            setDemandModalCard(null);
            showToast('Czas minął ⏱', 'info');
          }
          executeMakaoDrawOrPass(turnPlayer.id);
          // Jeśli dobrana karta pasowała, tura została — domykamy ją pasem.
          const after = roomRef.current?.makao;
          if (after?.drawnCardId && roomRef.current.players[after.currentTurnIdx]?.id === turnPlayer.id) {
            executeMakaoDrawOrPass(turnPlayer.id);
          }
        }
      }, [nowTick, playerId]);

      // =======================================================================
      // 8. SABOTEUR (KOCIA EKIPA VS PSY) ACTIONS
      // =======================================================================
      // Wspólne domknięcie ruchu: zapis stanu, dźwięk, zasłona „przekaż telefon”.
      const commitTurnResult = (res, actorId, stateKey) => {
        if (!res || res.error) {
          if (res?.error && actorId === activePlayerId) {
            SoundFX.error();
            showToast(res.error, 'error');
          }
          return null;
        }
        const updated = commitRoomState(() => res.room);
        if (!updated) return null;
        if (updated.status === 'finished') {
          SoundFX.win();
        } else if (updated.isPassAndPlay) {
          const nextPl = updated.players[updated[stateKey].currentTurnIdx];
          if (nextPl && !nextPl.isBot && nextPl.id !== actorId) setPassPhoneNextPlayer(nextPl);
        }
        return updated;
      };

      const executeSabPlayPath = (actorId, card, r, c, rotation = 0) => {
        const res = applySabPath(roomRef.current, actorId, card.id, r, c, rotation);
        if (!commitTurnResult(res, actorId, 'saboteur')) return;
        if (actorId === activePlayerId) SoundFX.play();
        setSelectedCardId(null);
        setSabActionTargetMode(null);
      };

      const executeSabAction = (actorId, card, targetInfo) => {
        const res = applySabAction(roomRef.current, actorId, card.id, targetInfo);
        if (!commitTurnResult(res, actorId, 'saboteur')) return;
        if (actorId === activePlayerId) {
          SoundFX.play();
          if (res.peek) {
            const worth = res.peekGoal?.value || 0;
            setSabPeekResult(res.peek !== 'mouse'
              ? '🪤 Mapa Węchu: to tylko pusta pułapka.'
              : roomRef.current?.saboteur?.duelVariant === 'duel'
              ? `🐭 Mapa Węchu: tu siedzi ${worth === 3 ? 'Złota Mysz (3 pkt)' : worth === 2 ? 'tłusta mysz (2 pkt)' : 'myszka (1 pkt)'}!`
              : '🐭 Mapa Węchu: TUTAJ JEST ZŁOTA MYSZ!');
          }
        }
        setSelectedCardId(null);
        setSabActionTargetMode(null);
      };

      const executeSabHeal = (actorId, cardIds) => {
        const res = applySabHeal(roomRef.current, actorId, cardIds);
        setSabHealFirst(null);
        if (!commitTurnResult(res, actorId, 'saboteur')) return;
        if (actorId === activePlayerId) SoundFX.play();
        setSelectedCardId(null);
        setSabActionTargetMode(null);
      };

      const executeSabDiscard = (actorId, card) => {
        const res = applySabDiscard(roomRef.current, actorId, card.id);
        if (!commitTurnResult(res, actorId, 'saboteur')) return;
        if (actorId === activePlayerId) SoundFX.draw();
        setSelectedCardId(null);
        setSabActionTargetMode(null);
      };

      const handleSabCellLongPress = ({ r, c, tile, goal, isStart, isGoalRow, peekedType }) => {
        if (isStart) {
          setSabInspectInfo({
            title: 'Koci Start (Komin)',
            badge: 'Punkt startowy',
            icon: '🐱',
            accent: '#D99B26',
            summary: 'Stąd wyrusza Kocia Ekipa. Wszystkie tunele muszą tworzyć nieprzerwane połączenie od tego komina aż do Złotej Myszy.',
            howToPlay: 'Dokładaj karty tuneli sąsiadujące z istniejącą trasą.',
            dirs: { N: 1, E: 1, S: 1, W: 1 },
            open: true
          });
          return;
        }
        if (tile) {
          setSabInspectInfo({
            title: tile.name || 'Kafelek dachu',
            badge: tile.open ? 'Drożny tunel na planszy' : 'Ślepy zaułek na planszy',
            icon: tile.open ? '🐾' : '🚧',
            accent: tile.open ? '#10B981' : '#E05A47',
            summary: tile.open
              ? 'Aktywny korytarz na dachu. Jeśli jest połączony ze startem, pozwala prowadzić trasę dalej w stronę celów.'
              : 'Zablokowane pole (ślepy zaułek). Nie przepuszcza kotów dalej — możesz je usunąć kartą Kłębek Chaosu.',
            howToPlay: 'Użyj karty Kłębek Chaosu, jeśli chcesz zburzyć to pole.',
            dirs: tile.dirs,
            open: tile.open
          });
          return;
        }
        if (isGoalRow && goal) {
          const knownType = goal.revealed ? goal.type : peekedType;
          const duel = roomRef.current?.saboteur?.duelVariant === 'duel';
          const owner = goal.claimedBy ? roomRef.current?.players.find(p => p.id === goal.claimedBy)?.name : null;
          setSabInspectInfo({
            title: knownType === 'mouse' ? (duel ? `Mysz warta ${goal.value} pkt` : 'Złota Mysz (Cel!)') : knownType === 'trap' ? 'Pusta Pułapka' : 'Zakryty cel',
            badge: goal.revealed ? (owner ? `Zdobył: ${owner}` : 'Odkryty cel') : peekedType ? 'Podejrzane Mapą Węchu' : 'Zakryta karta celu',
            icon: knownType === 'mouse' ? '🐭' : knownType === 'trap' ? '🪤' : '❓',
            accent: knownType === 'mouse' ? '#D99B26' : '#0B463C',
            summary: duel
              ? 'W Pojedynku jest 5 celów: Złota Mysz (3 pkt), tłusta mysz (2 pkt), dwie myszki (po 1 pkt) i pusta pułapka. Cel zdobywa ten, czyj komin jest z nim połączony tunelem.'
              : knownType === 'mouse'
              ? 'To tutaj ukrywa się Złota Mysz! Doprowadź do tego pola drożny tunel, aby wygrać rundę.'
              : knownType === 'trap'
              ? 'Sprawdzono Mapą Węchu — pod tym kafelkiem nie ma Złotej Myszy. Szukaj w pozostałych celach!'
              : 'Jedna z 3 zakrytych kart celu. Pod jedną kryje się Złota Mysz, a pod dwiema puste pułapki. Użyj Mapy Węchu, aby podejrzeć!',
            howToPlay: 'Doprowadź tunel obok tego pola lub użyj karty Mapa Węchu.'
          });
        }
      };

      // =======================================================================
      // 9. RUMMY (REMIK KLUBOWY) ACTIONS
      // =======================================================================
      const executeRummyDraw = (actorId, fromDiscard = false) => {
        const res = applyRummyDraw(roomRef.current, actorId, fromDiscard);
        if (commitTurnResult(res, actorId, 'rummy') && actorId === activePlayerId) SoundFX.draw();
      };

      const executeRummyMeld = (actorId, cardIds) => {
        const res = applyRummyMeld(roomRef.current, actorId, cardIds);
        if (!commitTurnResult(res, actorId, 'rummy')) return;
        if (actorId === activePlayerId) {
          SoundFX.play();
          setRummySelectedIds([]);
        }
      };

      const executeRummyDiscard = (actorId, cardId) => {
        const res = applyRummyDiscard(roomRef.current, actorId, cardId);
        if (!commitTurnResult(res, actorId, 'rummy')) return;
        if (actorId === activePlayerId) {
          SoundFX.play();
          setRummySelectedIds([]);
        }
      };

      // =======================================================================
      // 10. RELIABLE AI BOT ENGINE + WATCHDOG & CHAT
      // =======================================================================
      const botStepImpl = () => {
        const curr = roomRef.current;
        if (!curr || curr.status !== 'playing') return;
        if (curr.isOnline && curr.hostId !== playerId) return;

        const gState = curr.gameType === 'makao' ? curr.makao : curr.gameType === 'saboteur' ? curr.saboteur : curr.rummy;
        if (!gState) return;
        const turnPlayer = curr.players[gState.currentTurnIdx];
        if (!turnPlayer || !turnPlayer.isBot) return;

        if (curr.gameType === 'makao') {
          // Najpierw bot sprawdza, czy ktoś zapomniał krzyknąć „MAKAO!”.
          const sleepy = makaoCatchTargets(curr.players, gState, curr.makaoRules, turnPlayer.id).filter(p => !p.isBot)[0];
          if (sleepy && Math.random() < BOT_LEVELS[botLevel].catchChance) {
            handleCatchMakao(sleepy.id, turnPlayer.id);
            return;
          }
          let move = chooseMakaoBotMove(curr.players, gState, curr.makaoRules, turnPlayer.id);
          const playable = (gState.hands[turnPlayer.id] || []).filter(c => canPlayMakaoCard(c, gState, curr.makaoRules));
          if (playable.length > 0 && Math.random() < BOT_LEVELS[botLevel].mistake) {
            // Słabszy ruch: losowa grywalna karta, bez żądań.
            move = { type: 'play', cardIds: [playable[Math.floor(Math.random() * playable.length)].id], demand: null };
          }
          if (move.type === 'play') executeMakaoPlayCard(turnPlayer.id, move.cardIds, move.demand);
          else executeMakaoDrawOrPass(turnPlayer.id);
          return;
        }

        if (curr.gameType === 'saboteur') {
          let move = chooseSabBotMove(curr, turnPlayer.id);
          if (!move) return;
          const sh = gState.hands[turnPlayer.id] || [];
          if (move.type !== 'discard' && sh.length > 0 && Math.random() < BOT_LEVELS[botLevel].mistake) {
            move = { type: 'discard', cardId: sh[Math.floor(Math.random() * sh.length)].id };
          }
          if (move.type === 'heal') {
            executeSabHeal(turnPlayer.id, move.cardIds);
            return;
          }
          const card = (gState.hands[turnPlayer.id] || []).find(c => c.id === move.cardId);
          if (!card) return;
          if (move.type === 'path') executeSabPlayPath(turnPlayer.id, card, move.r, move.c, move.rot);
          else if (move.type === 'action') executeSabAction(turnPlayer.id, card, move.target);
          else executeSabDiscard(turnPlayer.id, card);
          return;
        }

        if (curr.gameType === 'rummy') {
          let move = chooseRummyBotMove(curr, turnPlayer.id);
          const rh = gState.hands[turnPlayer.id] || [];
          if (move.type === 'discard' && rh.length > 0 && Math.random() < BOT_LEVELS[botLevel].mistake) {
            move = { type: 'discard', cardId: rh[Math.floor(Math.random() * rh.length)].id };
          }
          if (move.type === 'draw') executeRummyDraw(turnPlayer.id, move.fromDiscard);
          else if (move.type === 'meld') executeRummyMeld(turnPlayer.id, move.cardIds);
          else executeRummyDiscard(turnPlayer.id, move.cardId);
        }
      };
      // Ref trzyma zawsze najświeższą wersję funkcji — inaczej bot używałby starego stanu
      // (m.in. nie wysyłałby swoich ruchów do pozostałych graczy online).
      const botStepRef = useRef(null);
      botStepRef.current = botStepImpl;
      const botStepTrigger = useCallback(() => { if (botStepRef.current) botStepRef.current(); }, []);

      useEffect(() => {
        if (screen !== 'game' || room?.status !== 'playing') return;
        const gState = room.gameType === 'makao' ? room.makao : room.gameType === 'saboteur' ? room.saboteur : room.rummy;
        const turnPlayer = room.players[gState?.currentTurnIdx || 0];
        if (!turnPlayer?.isBot) return;

        // Gracz z jedną kartą bez okrzyku dostaje chwilę na kliknięcie „MAKAO!”, zanim bot go przyłapie.
        const graceForMakao = room.gameType === 'makao' &&
          makaoCatchTargets(room.players, room.makao, room.makaoRules, turnPlayer.id).some(p => !p.isBot);
        const timer = setTimeout(botStepTrigger, graceForMakao ? 2600 : BOT_LEVELS[botLevel].pace);
        const watchdog = setInterval(botStepTrigger, 4000);
        return () => {
          clearTimeout(timer);
          clearInterval(watchdog);
        };
      }, [screen, room?.version, room?.status, botStepTrigger, botLevel]);

      // Efekty wiadomości widoczne przy stole: dymek przy graczu, wybuch emotek, trafienie „pociskiem”.
      const showMessageEffects = (msg) => {
        setFloatingBubbles(prev => {
          const next = { ...prev, [msg.senderId]: { text: msg.text, id: msg.id } };
          if (msg.targetId && msg.burst) next[msg.targetId] = { text: `${msg.burst} od: ${msg.senderName}`, id: `${msg.id}_hit`, hit: true };
          return next;
        });
        const emoji = msg.burst || (CHAT_REACTIONS.includes(msg.text) ? msg.text : null);
        if (emoji) {
          const id = `${msg.id}_${Date.now()}`;
          const bits = Array.from({ length: 14 }, (_, i) => ({
            left: 6 + Math.random() * 88,
            delay: Math.random() * 0.35,
            size: 22 + Math.random() * 26,
            drift: (Math.random() - 0.5) * 120,
            spin: (Math.random() - 0.5) * 80,
            key: i
          }));
          setBursts(prev => [...prev.slice(-2), { id, emoji, bits }]);
          setTimeout(() => setBursts(prev => prev.filter(b => b.id !== id)), 2300);
        }
      };

      // Wysyła wiadomość: online przez Firestore (widzą ją wszyscy przy stole), offline tylko lokalnie.
      const postChatMessage = (msgObj) => {
        const curr = roomRef.current;
        if (!curr) return;
        if (curr.isOnline && fbReady && dbRef.current && window.__FB) {
          const fb = window.__FB;
          const msgsCol = fb.collection(dbRef.current, 'artifacts', fb.appId, 'public', 'data', 'rooms', curr.code, 'messages');
          fb.addDoc(msgsCol, msgObj).catch(() => showToast('Wiadomość nie została wysłana', 'error'));
          // Własne wiadomości pokazujemy od razu; cudze (i botów) przyjdą z serwera.
          if (msgObj.senderId === playerId) showMessageEffects(msgObj);
        } else {
          setMessages(prev => [...prev.slice(-59), msgObj]);
          if (msgObj.senderId !== playerId) {
            SoundFX.chat();
            if (!chatOpenRef.current) setUnreadCount(u => u + 1);
          }
          showMessageEffects(msgObj);
        }
      };

      const botMessage = (bot, text) => ({
        id: uid('msg'),
        senderId: bot.id,
        senderName: bot.name,
        avatarId: bot.avatarId,
        frameId: bot.frameId,
        text: `${text} ${BOT_SIGNATURE[bot.avatarId] || '🤖'}`,
        createdAt: Date.now()
      });

      const sendChatMessage = (rawText, extra = {}) => {
        const text = (rawText || '').trim().slice(0, 140);
        const curr = roomRef.current;
        if (!text || !curr) return;
        setChatInput('');

        // Komendy czatu (nie trafiają do rozmowy): /reset wznawia bota, gdy utknął.
        if (['/reset', '/bot'].includes(text.toLowerCase())) {
          const hasBot = curr.players.some(p => p.isBot);
          const state = curr.makao || curr.saboteur || curr.rummy;
          const turnPlayer = state ? curr.players[state.currentTurnIdx] : null;
          if (!hasBot) showToast('Przy tym stole nie ma bota', 'info');
          else if (!turnPlayer || !turnPlayer.isBot) showToast('Teraz nie jest tura bota — zresetuję go, gdy przyjdzie jego kolej', 'info');
          else if (curr.isOnline && curr.hostId !== playerId) showToast('Bota wznawia gospodarz stołu', 'info');
          else {
            showToast('Bot wraca do gry 🤖', 'success');
            if (botStepRef.current) botStepRef.current();
          }
          return;
        }

        SoundFX.chat();
        postChatMessage({
          id: uid('msg'),
          senderId: playerId,
          senderName: playerName.trim() || 'Gracz',
          avatarId,
          frameId,
          text,
          createdAt: Date.now(),
          ...extra
        });

        // Boty odpowiadają (w grze online robi to telefon gospodarza, żeby odpowiedź była jedna).
        const bots = curr.players.filter(p => p.isBot);
        if (bots.length === 0 || (curr.isOnline && curr.hostId !== playerId)) return;
        const target = extra.targetId ? bots.find(b => b.id === extra.targetId) : null;
        if (extra.targetId && !target) return;
        const bot = target || bots[Math.floor(Math.random() * bots.length)];

                          const card = room.saboteur.hands[activePlayerId]?.find(c => c.id === selectedCardId);

                        } else if (p.id !== activePlayerId && !room.isPassAndPlay) {
                          SoundFX.inspect();
                          setPokeTarget(p);
                        }
                      }}
                      className={`relative flex items-center gap-2.5 px-3 py-2 rounded-2xl border transition flex-shrink-0 ${
                        isTurn
                          ? 'bg-white border-2 border-[#D99B26] shadow-md'
                          : 'bg-white/85 border-[#E5E2DC]'
                      } ${(sabActionTargetMode === 'break_claw' || sabActionTargetMode === 'fix_claw') ? 'cursor-pointer ring-2 ring-[#E05A47]' : ''}`}
                    >
                      {bubble && (
                        <div
                          key={bubble.id}
                          className={`chat-pop-bubble absolute inset-0 z-30 px-3 rounded-2xl text-white text-xs font-bold flex items-center justify-center text-center leading-tight overflow-hidden pointer-events-none ${bubble.hit ? 'bg-[#E84A3A] chip-hit' : 'bg-[#141A18]'}`}
                        >
                          <span className="line-clamp-2">{bubble.hit ? '' : '💬 '}{bubble.text}</span>
                        </div>
                      )}
                      <PlayerAvatar avatarId={p.avatarId} frameId={p.frameId} size={34} badge={isBrokenClaw ? '🩹' : p.isBot ? '🤖' : null} />
                      <div className="leading-tight min-w-0">
                        <span className="block text-xs font-extrabold text-[#141A18] max-w-[86px] truncate">
                          {p.id === activePlayerId ? 'Ty' : p.name}
                        </span>
                        {isOneCardAlert ? (
                          <span className={`inline-block mt-0.5 text-[10px] font-black px-1.5 py-0.5 rounded-md ${saidIt ? 'bg-[#FEF3C7] text-[#92400E]' : 'bg-[#FEE2E2] text-[#B91C1C]'}`}>
                            {saidIt ? '📣 MAKAO!' : 'ostatnia karta'}
                          </span>
                        ) : (
                          <span className="block mt-0.5 text-[10px] font-bold text-[#586560]">
                            {isTurn ? '● ruch' : `${p.score || 0} 🏆`}
                          </span>
                        )}
                      </div>

                      {/* Liczba kart w ręce — duża, na rewersie karty */}
                      <div
                        className={`count-card ${isOneCardAlert ? 'count-card-alert' : cardsCount <= 3 && room.gameType === 'makao' ? 'count-card-low' : ''}`}
                        aria-label={`${cardsCount} ${cardsCount === 1 ? 'karta' : plCards(cardsCount)} w ręce`}
                      >
                        <span key={cardsCount} className="count-num">{cardsCount}</span>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* ===============================================================
                  GAME VIEW A: KLASYCZNE MAKAO
              ================================================================ */}
              {room.gameType === 'makao' && room.makao && (() => {
                const ms = room.makao;
                const rules = room.makaoRules;
                const topCard = ms.discardPile[ms.discardPile.length - 1];
                const suitOrder = { spades: 1, hearts: 2, clubs: 3, diamonds: 4, joker: 5 };
                const myHand = [...(ms.hands[activePlayerId] || [])].sort(
                  (a, b) => (suitOrder[a.suit] - suitOrder[b.suit]) || RANKS.indexOf(a.rank) - RANKS.indexOf(b.rank)
                );
                const turnPlayer = room.players[ms.currentTurnIdx];
                const isMyTurn = turnPlayer?.id === activePlayerId && room.status === 'playing';
                const hasPlayable = isMyTurn && myHand.some(c => canPlayMakaoCard(c, ms, rules));
                const drewCard = isMyTurn && Boolean(ms.drawnCardId);
                const timerOn = room.isOnline && Number(rules.turnTime) > 0 && room.status === 'playing';
                const timeLeft = Math.max(0, Number(rules.turnTime) - Math.floor((nowTick - (ms.turnStartedAt || nowTick)) / 1000));
                const pickFirst = makaoPick.length > 0 ? myHand.find(c => c.id === makaoPick[0]) : null;
                const picking = isMyTurn && Boolean(pickFirst);
                const pickMatesLeft = picking ? myHand.filter(c => c.rank === pickFirst.rank && !makaoPick.includes(c.id)).length : 0;
                // Okrzyk można zapowiedzieć z wyprzedzeniem: gdy po tym ruchu zostanie jedna karta.
                const canDeclare = rules.catchMakao && !room.isPassAndPlay && room.status === 'playing' && !ms.saidMakao[activePlayerId] &&
                  (myHand.length === 1 || (hasPlayable && myHand.length >= 2 &&
                    myHand.some(c => canPlayMakaoCard(c, ms, rules) && myHand.length - 1 - makaoMates(myHand, c, rules).length <= 1)));
                // Rywale z jedną kartą, którzy nie krzyknęli „MAKAO!” — można im powiedzieć STOP MAKAO.
                const sleepers = room.status === 'playing' && !room.isPassAndPlay
                  ? makaoCatchTargets(room.players, ms, rules, activePlayerId)
                  : [];

                const drawLabel = drewCard
                  ? 'Pasuję'
                  : ms.pendingDraw > 0
                  ? `Biorę ${ms.pendingDraw} ${plCards(ms.pendingDraw)}`
                  : ms.pendingSkip > 0
                  ? (ms.pendingSkip === 1 ? 'Czekam kolejkę' : `Czekam ${ms.pendingSkip} kolejki`)
                  : 'Dobierz kartę';

                const hint = !isMyTurn
                  ? `Ruch: ${turnPlayer?.name || '…'}`
                  : picking
                  ? (pickMatesLeft > 0 ? `Możesz dołożyć kolejne ${pickFirst.rank} — ostatnia zostanie na wierzchu` : 'Zagraj wybrane karty')
                  : drewCard
                  ? 'Dobrana karta pasuje — zagraj ją albo spasuj'
                  : hasPlayable
                  ? (ms.pendingDraw > 0 ? 'Obroń się podświetloną kartą albo weź karę' : 'Twój ruch — zagraj podświetloną kartę')
                  : ms.pendingDraw > 0
                  ? 'Nie masz czym się obronić — bierzesz karę'
                  : ms.pendingSkip > 0
                  ? 'Nie masz czwórki — czekasz kolejkę'
                  : 'Nic nie pasuje — dobierz kartę';

                return (
                  <div className="flex-1 flex flex-col justify-between gap-2.5">
                    {/* Stół */}
                    <div className="emerald-table p-3.5 flex-1 flex flex-col justify-between min-h-[250px]">
                      <div className="flex items-center justify-between gap-2 text-xs">
                        <span className="px-2.5 py-1 rounded-full bg-black/25 font-bold text-[#F7F5F0] truncate" aria-live="polite">
                          {ms.lastEvent}
                        </span>
                        {timerOn && (
                          <span className={`font-mono-code font-black px-2.5 py-1 rounded-full flex-shrink-0 ${timeLeft <= 7 ? 'bg-[#E84A3A] text-white' : 'bg-black/25 text-[#FDE68A]'}`}>
                            ⏱ {timeLeft}s
                          </span>
                        )}
                      </div>

                      <div className="flex items-center justify-center gap-7 sm:gap-10 my-2">
                        <button
                          onClick={() => isMyTurn && executeMakaoDrawOrPass(activePlayerId)}
                          className="flex flex-col items-center gap-2"
                          aria-label={`Talia, ${ms.deck.length} kart. ${drawLabel}`}
                        >
                          <div className="relative">
                            <div className="pile-shadow-card" style={{ transform: 'translate(3px, 3px)' }} />
                            <PlayingCardView faceDown />
                            <span className="absolute -bottom-2 -right-2 px-2 py-0.5 rounded-full bg-[#141A18] text-[#FDE68A] border border-[#D99B26] font-mono-code text-[11px] font-black shadow">
                              {ms.deck.length}
                            </span>
                          </div>
                          <span className="text-[10px] font-extrabold uppercase tracking-wider text-[#CBE0DA]">Talia</span>
                        </button>

                        <div className="flex flex-col items-center gap-2">
                          <div className="relative">
                            {ms.discardPile.length > 1 && (
                              <div className="pile-shadow-card" style={{ transform: 'rotate(-7deg) translate(-3px, 1px)' }} />
                            )}
                            {topCard && <PlayingCardView key={topCard.id} card={topCard} className="inspect-modal-anim" />}
                          </div>
                          <span className="text-[10px] font-extrabold uppercase tracking-wider text-[#CBE0DA]">Stos</span>
                        </div>
                      </div>

                      {/* Co teraz obowiązuje */}
                      <div className="flex flex-wrap items-center justify-center gap-2 min-h-[30px]">
                        {ms.pendingDraw > 0 && (
                          <span className="px-3 py-1 rounded-full bg-[#E84A3A] text-white text-xs font-black shadow">
                            💥 Kara: +{ms.pendingDraw} {plCards(ms.pendingDraw)}
                          </span>
                        )}
                        {ms.pendingSkip > 0 && (
                          <span className="px-3 py-1 rounded-full bg-[#D99B26] text-[#141A18] text-xs font-black shadow">
                            🛑 Postój: {ms.pendingSkip} {ms.pendingSkip === 1 ? 'kolejka' : 'kolejki'}
                          </span>
                        )}
                        {ms.demandedSuit && (
                          <span className="px-3 py-1 rounded-full bg-white text-xs font-black shadow" style={{ color: SUIT_META[ms.demandedSuit]?.color }}>
                            Żądany kolor: {SUIT_META[ms.demandedSuit]?.symbol} {SUIT_META[ms.demandedSuit]?.label}
                          </span>
                        )}
                        {ms.demandedRank && (
                          <span className="px-3 py-1 rounded-full bg-white text-[#141A18] text-xs font-black shadow">
                            Żądana figura: {ms.demandedRank}
                          </span>
                        )}
                      </div>

                      {sleepers.length > 0 && (
                        <div className="flex flex-col items-center gap-1.5 pb-2">
                          {sleepers.map(p => (
                            <button
                              key={p.id}
                              onClick={() => handleCatchMakao(p.id)}
                              className="tactile-btn stop-makao-btn px-5 py-2.5 text-sm makao-pulse"
                            >
                              <span className="text-lg leading-none">✋</span>
                              <span>STOP MAKAO!</span>
                              <span className="text-[10px] font-extrabold bg-black/20 px-2 py-0.5 rounded-full">{p.name} +5</span>
                            </button>
                          ))}
                        </div>
                      )}

                      <div className="flex items-center justify-center gap-2.5 pt-1">
                        {picking ? (
                          <>
                            <button onClick={() => playMakaoCards(makaoPick)} className="tactile-btn btn-coral px-5 text-sm">
                              {makaoPick.length === 1 ? 'Zagraj 1 kartę' : `Zagraj ${makaoPick.length} ${plCards(makaoPick.length)}`}
                            </button>
                            <button onClick={() => setMakaoPick([])} className="tactile-btn btn-paper px-4 text-sm" aria-label="Anuluj wybór">
                              Anuluj
                            </button>
                          </>
                        ) : (
                          <button
                            disabled={!isMyTurn}
                            onClick={() => executeMakaoDrawOrPass(activePlayerId)}
                            className={`tactile-btn px-5 text-sm ${
                              !isMyTurn ? 'btn-paper' : ms.pendingDraw > 0 && !hasPlayable ? 'btn-coral' : !hasPlayable ? 'btn-gold' : 'btn-paper'
                            }`}
                          >
                            {drawLabel}
                          </button>
                        )}

                        {canDeclare && !picking && (
                          <button onClick={handleSayMakao} className="tactile-btn btn-gold px-5 text-sm makao-pulse">
                            📣 MAKAO!
                          </button>
                        )}
                      </div>
                    </div>

                    {/* Ręka gracza */}
                    <div className="bento-card px-2 pt-2.5 pb-1.5">
                      <div className="flex items-center justify-between gap-2 px-1.5">
                        <span className={`text-xs font-extrabold truncate ${isMyTurn ? 'text-[#0B463C]' : 'text-[#586560]'}`}>
                          {isMyTurn ? '● ' : '⏳ '}{hint}
                        </span>
                        <span className={`text-xs font-black px-2.5 py-1 rounded-full flex-shrink-0 ${myHand.length === 1 ? 'bg-[#E84A3A] text-white' : 'bg-[#0B463C] text-[#FDE68A]'}`}>
                          <span className="font-mono-code text-sm">{myHand.length}</span> {myHand.length === 1 ? 'karta' : plCards(myHand.length)}
                        </span>
                      </div>

                      <FanHand
                        cards={myHand}
                        renderCard={(card) => {
                          const pickedIdx = picking ? makaoPick.indexOf(card.id) : -1;
                          // W trakcie wyboru podświetlamy karty tej samej figury, które można dołożyć.
                          const playable = picking
                            ? pickedIdx === -1 && card.rank === pickFirst.rank
                            : isMyTurn && canPlayMakaoCard(card, ms, rules);
                          return (
                            <PlayingCardView
                              card={card}
                              playable={playable}
                              selected={pickedIdx !== -1}
                              dimmed={isMyTurn && !playable && pickedIdx === -1}
                              className={ms.drawnCardId === card.id ? 'just-drawn' : ''}
                              actionTag={pickedIdx !== -1 && makaoPick.length > 1
                                ? (pickedIdx === makaoPick.length - 1 ? 'WIERZCH' : `${pickedIdx + 1}.`)
                                : makaoActionTag(card, rules)}
                              onClick={() => handleMakaoCardClick(card)}
                            />
                          );
                        }}
                      />
                    </div>
                  </div>
                );
              })()}

              {/* ===============================================================
                  GAME VIEW B: KOCIA EKIPA VS PSY (SABOTEUR)
              ================================================================ */}
              {room.gameType === 'saboteur' && room.saboteur && (() => {
                const ss = room.saboteur;
                const myHand = ss.hands[activePlayerId] || [];
                const myRole = ss.roles[activePlayerId] || 'cat';
                const isMyTurn = room.players[ss.currentTurnIdx]?.id === activePlayerId && room.status === 'playing';
                const selectedCard = myHand.find(c => c.id === selectedCardId);
                const myPeeks = ss.peekedGoals[activePlayerId] || {};
                const isDuel = ss.duelVariant === 'duel';
                const rivalId = room.players.find(p => p.id !== activePlayerId)?.id;
                const myStartKey = sabStartKey(ss, activePlayerId);
                const amBroken = Boolean(ss.brokenClaws[activePlayerId]);

                return (
                  <div className="flex-1 flex flex-col justify-between gap-2">
                    {/* Role & Status Strip */}
                    <div className="flex items-center justify-between gap-2 px-3 py-2 rounded-2xl bg-white border border-[#E5E2DC] text-xs">
                      <span className={`font-black px-2.5 py-0.5 rounded-full flex-shrink-0 ${myRole === 'cat' ? 'bg-[#DCFCE7] text-[#065F46]' : 'bg-[#FEE2E2] text-[#991B1B]'}`}>
                        {isDuel
                          ? `🐭 ${ss.mice?.[activePlayerId] || 0} : ${ss.mice?.[rivalId] || 0} • runda ${room.round || 1}/${SAB_DUEL_ROUNDS}`
                          : myRole === 'cat'
                          ? '🐱 Twoja rola: Kot'
                          : '🐶 Twoja rola: Chytry Pies'}
                      </span>
                      <span className="text-[#66736E] font-bold truncate">{ss.lastEvent}</span>
                    </div>

                    {sabPeekResult && (
                      <div className="p-2.5 rounded-2xl bg-[#FEF3C7] border border-[#D99B26] text-xs font-black text-[#92400E] flex items-center justify-between">
                        <span>{sabPeekResult}</span>
                        <button onClick={() => setSabPeekResult(null)} className="px-2">✕</button>
                      </div>
                    )}

                    {/* 5x7 Roof Grid */}
                    <div className="emerald-table p-2.5 sm:p-3">
                      <div className="grid grid-cols-7 gap-1 sm:gap-1.5">
                        {Array.from({ length: SAB_ROWS }).map((_, r) =>
                          Array.from({ length: SAB_COLS }).map((__, c) => {
                            const key = `${r}_${c}`;
                            const tile = ss.board[key];
                            const goal = ss.goals[key];
                            const isStart = Boolean(tile?.isStart);
                            const isGoalRow = Boolean(goal);
                            const isValidDrop = isMyTurn && !amBroken && selectedCard?.type === 'path' && canPlaceSabTile(ss.board, r, c, selectedCard, sabRotation, myStartKey, ss.goals);
                            const isDestroyTarget = isMyTurn && sabActionTargetMode === 'yarn_bomb' && tile && !tile.isStart;
                            const isPeekTarget = isMyTurn && sabActionTargetMode === 'map_sniff' && isGoalRow && goal && !goal.revealed;
                            const peekedType = myPeeks[key];

                            return (
                              <SaboteurBoardCell
                                key={key}
                                r={r}
                                c={c}
                                tile={tile}
                                goal={goal}
                                isStart={isStart}
                                isGoalRow={isGoalRow}
                                startLabel={isStart && tile.owner ? (tile.owner === activePlayerId ? 'TY' : 'RYWAL') : null}
                                claimLabel={goal?.claimedBy ? (goal.claimedBy === activePlayerId ? 'TY' : 'RYWAL') : null}
                                isValidDrop={isValidDrop || isPeekTarget}
                                isDestroyTarget={isDestroyTarget}
                                peekedType={peekedType}
                                onLongPress={handleSabCellLongPress}
                                onClick={() => {
                                  if (!isMyTurn) return;
                                  if (isValidDrop && selectedCard) {
                                    executeSabPlayPath(activePlayerId, selectedCard, r, c, sabRotation);
                                  } else if (isDestroyTarget && selectedCard) {
                                    executeSabAction(activePlayerId, selectedCard, key);
                                  } else if (isPeekTarget && selectedCard) {
                                    executeSabAction(activePlayerId, selectedCard, key);
                                  }
                                }}
                              />
                            );
                          })
                        )}
                      </div>
                    </div>

                    {/* Player Hand + Rotate / Discard */}
                    <div className="bento-card p-2.5">
                      <div className="flex items-center justify-between gap-2 px-1 mb-1">
                        <span className="text-xs font-extrabold text-[#18221F]">
                          {isMyTurn ? (amBroken ? '🩹 Złamany pazur — ulecz się albo wymień kartę' : '🟢 Wybierz kartę (przytrzymaj = opis)') : `⏳ Ruch: ${room.players[ss.currentTurnIdx]?.name}`}
                        </span>
                        <div className="flex items-center gap-1.5">
                          {selectedCard && (
                            <button
                              onClick={() => setSabInspectInfo(getSabCardDetails(selectedCard, sabRotation === 180))}
                              className="text-[11px] font-extrabold px-2.5 py-1 rounded-xl bg-[#FEF3C7] text-[#92400E] border border-[#FDE68A]"
                            >
                              ⓘ Opis
                            </button>
                          )}
                          {selectedCard?.type === 'path' && (
                            <button
                              onClick={() => setSabRotation(r => (r === 0 ? 180 : 0))}
                              className="text-[11px] font-extrabold px-2.5 py-1 rounded-xl bg-[#F7F5F0] border border-[#E5E2DC]"
                            >
                              🔄 Obróć 180°
                            </button>
                          )}
                          {isMyTurn && amBroken && selectedCard && myHand.length >= 2 && (
                            <button
                              onClick={() => {
                                setSabHealFirst(selectedCard.id);
                                showToast('Wybierz drugą kartę do odrzucenia — opatrunek zniknie', 'info');
                              }}
                              className={`text-[11px] font-extrabold px-2.5 py-1 rounded-xl border ${sabHealFirst ? 'bg-[#0B463C] text-white border-[#0B463C]' : 'bg-[#DCFCE7] text-[#065F46] border-[#A7D7C5]'}`}
                            >
                              🩹 Ulecz za 2 karty
                            </button>
                          )}
                          {isMyTurn && selectedCard && (
                            <button
                              onClick={() => executeSabDiscard(activePlayerId, selectedCard)}
                              className="text-[11px] font-extrabold px-2.5 py-1 rounded-xl bg-[#FEE2E2] text-[#991B1B]"
                            >
                              Wymień kartę
                            </button>
                          )}
                        </div>
                      </div>

                      <div className="hand-fan" style={{ '--card-overlap': '6px' }}>
                        {myHand.map(card => (
                          <SaboteurCardView
                            key={card.id}
                            card={card}
                            selected={selectedCardId === card.id}
                            rotated={selectedCardId === card.id && sabRotation === 180}
                            onLongPress={(c, rot) => setSabInspectInfo(getSabCardDetails(c, rot))}
                            onClick={() => {
                              if (!isMyTurn) {
                                setSabInspectInfo(getSabCardDetails(card, false));
                                return;
                              }
                              if (sabHealFirst && sabHealFirst !== card.id) {
                                executeSabHeal(activePlayerId, [sabHealFirst, card.id]);
                                return;
                              }
                              setSabHealFirst(null);
                              if (selectedCardId === card.id) {
                                setSelectedCardId(null);
                                setSabActionTargetMode(null);
                                return;
                              }
                              setSelectedCardId(card.id);
                              setSabRotation(0);
                              if (card.type === 'action') {
                                setSabActionTargetMode(card.action);
                                const hints = {
                                  break_claw: 'Kliknij awatar gracza u góry, aby złamać mu pazur',
                                  fix_claw: 'Kliknij awatar gracza z opatrunkiem, aby go uleczyć',
                                  map_sniff: 'Kliknij zakrytą kartę celu (?) po prawej stronie planszy',
                                  yarn_bomb: 'Kliknij dowolny ułożony tunel na planszy, aby go zburzyć'
                                };
                                showToast(hints[card.action], 'info');
                              } else {
                                setSabActionTargetMode(null);
                              }
                            }}
                          />
                        ))}
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* ===============================================================
                  GAME VIEW C: REMIK KLUBOWY
              ================================================================ */}
              {room.gameType === 'rummy' && room.rummy && (() => {
                const rs = room.rummy;
                const myHand = rs.hands[activePlayerId] || [];
                const topDiscard = rs.discardPile[rs.discardPile.length - 1];
                const isMyTurn = room.players[rs.currentTurnIdx]?.id === activePlayerId && room.status === 'playing';
                const selectedCards = myHand.filter(c => rummySelectedIds.includes(c.id));
                const previewMeld = validateRummyMeld(selectedCards);

                return (
                  <div className="flex-1 flex flex-col justify-between gap-2.5">
                    <div className="emerald-table p-4 flex-1 flex flex-col justify-between min-h-[240px]">
                      <div className="flex items-center justify-between text-xs">
                        <span className="px-2.5 py-1 rounded-full bg-black/25 font-bold truncate">{rs.lastEvent}</span>
                        <span className="px-2.5 py-1 rounded-full bg-white/15 font-extrabold">
                          {rs.opened[activePlayerId] ? '✓ Otwarte' : 'Otwarcie: 30 pkt'}
                        </span>
                      </div>

                      {/* Stock & Discard */}
                      <div className="flex items-center justify-center gap-8 my-2">
                        <div className="flex flex-col items-center gap-1">
                          <PlayingCardView
                            faceDown
                            small
                            onClick={() => isMyTurn && !rs.hasDrawn && executeRummyDraw(activePlayerId, false)}
                          />
                          <span className="text-[11px] font-bold text-[#CBE0DA]">Talia ({rs.deck.length})</span>
                        </div>
                        <div className="flex flex-col items-center gap-1">
                          {topDiscard ? (
                            <PlayingCardView
                              card={topDiscard}
                              small
                              playable={isMyTurn && !rs.hasDrawn}
                              onClick={() => isMyTurn && !rs.hasDrawn && executeRummyDraw(activePlayerId, true)}
                            />
                          ) : (
                            <div className="w-12 h-16 rounded-lg border border-dashed border-white/30" />
                          )}
                          <span className="text-[11px] font-bold text-[#CBE0DA]">Odkryta</span>
                        </div>
                      </div>

                      {/* Melds on Table */}
                      <div className="bg-black/20 rounded-2xl p-2.5 max-h-28 overflow-y-auto custom-scroll">
                        {rs.melds.length === 0 ? (
                          <p className="text-[11px] text-center text-[#CBE0DA]/75 py-2">
                            Wyłożone układy pojawią się tutaj
                          </p>
                        ) : (
                          <div className="flex flex-wrap gap-2">
                            {rs.melds.map(m => (
                              <div key={m.id} className="flex items-center gap-1 bg-white/10 px-2 py-1 rounded-xl">
                                <span className="text-[10px] font-bold text-[#FDE68A] mr-1">{m.ownerName}:</span>

                <div>

                    <ul className="space-y-1.5">
                      {history.slice(0, 12).map(h => {

                          <li key={h.id} className="p-2.5 rounded-2xl bg-[#F7F5F0] border border-[#E5E2DC]">
                            <div className="flex items-center justify-between gap-2">

                          setBackupMsg({ ok: false, text: 'Import anulowany — nic nie zmieniono.' });

                      }}

                          <span className={`block text-[9px] font-semibold ${active ? 'text-[#CBE0DA]' : 'text-[#66736E]'}`}>{open ? (active ? 'wybrany' : 'odblokowany') : t.hint}</span>

                        <span className="block h-10 rounded-xl" style={{ background: `radial-gradient(circle at 50% 35%, ${th.a}, ${th.b} 65%, ${th.c})` }} />

                    {Object.entries(BOT_LEVELS).map(([id, lv]) => (
                      <button key={id} onClick={() => setBotLevel(id)} className={`py-2 rounded-xl text-xs font-extrabold border ${botLevel === id ? 'bg-[#0F3D36] text-white border-[#0F3D36]' : 'bg-white border-[#E5E2DC] text-[#18221F]'}`}>
                        {lv.label}

                  </div>
                  <p className="text-[10px] text-[#66736E] font-semibold mt-1.5">{BOT_LEVELS[botLevel].desc}</p>

                      ['Wygrane', progress.won],
                      ['Skuteczność', progress.played ? `${Math.round(100 * progress.won / progress.played)}%` : '–'],
                      ['Seria', progress.streak],
                      ['Najlepsza seria', progress.bestStreak],
                      ['Myszy', progress.mice]
                    ].map(([label, value]) => (
                      <div key={label} className="p-2 rounded-xl bg-[#F7F5F0] border border-[#E5E2DC] text-center">
                        <div className="font-mono-code text-lg font-black text-[#0F3D36]">{value}</div>
                        <div className="text-[9px] font-bold uppercase tracking-wide text-[#66736E]">{label}</div>
                      </div>
                    ))}
                  </div>
                  <div className="mt-2.5 space-y-1.5">
                    {[['makao', '🃏 Makao'], ['saboteur', '🐱 Kocia Ekipa'], ['rummy', '♠️ Remik']].map(([id, label]) => {
                      const g = progress.games[id];
                      const pct = g.played ? Math.round(100 * g.won / g.played) : 0;
                      return (
                        <div key={id} className="text-[11px] font-bold text-[#18221F]">
                          <div className="flex justify-between"><span>{label}</span><span>{g.won} / {g.played}</span></div>

                    <p className="text-[10px] font-semibold text-[#66736E] mt-1.5">Pojedynki o myszy: wygrane {progress.duelWins} z {progress.duelMatches}</p>

                <button onClick={() => setProfileOpen(false)} className="tactile-btn btn-emerald w-full py-3 text-sm">

                </button>
              </div>

          )}

          {/* Zasady i warianty (jeden arkusz: ściąga + ustawienia stołu) */}
          {rulesOpen && (() => {
            const game = room?.gameType || selectedGame;
            const gameMeta = gamesCatalog.find(g => g.id === game);
            const rules = room?.makaoRules || makaoRules;
            const canEdit = !room || (room.hostId === playerId && room.status !== 'playing');
            const setRule = (key, value) => {
              if (!canEdit) return;
              if (room) {
                commitRoomState(prev => ({ ...prev, makaoRules: { ...prev.makaoRules, [key]: value } }));
              }
              // Gospodarz i menu: zapamiętujemy też jako ustawienia domyślne na później.
              setMakaoRules(prev => ({ ...prev, [key]: value }));
            };
            const resetRules = () => {
              if (!canEdit) return;
              if (room) commitRoomState(prev => ({ ...prev, makaoRules: { ...DEFAULT_MAKAO_RULES } }));
              setMakaoRules({ ...DEFAULT_MAKAO_RULES });
            };
            const isClassic = Object.keys(DEFAULT_MAKAO_RULES).every(k => rules[k] === DEFAULT_MAKAO_RULES[k]);
            const red = { color: SUIT_META.hearts.color };

            return (
              <div className="sheet-backdrop" onClick={() => setRulesOpen(false)}>
                <div className="sheet-panel custom-scroll space-y-4" onClick={e => e.stopPropagation()}>
                  <div className="flex items-center justify-between">
                    <h3 className="font-serif-display text-xl font-black text-[#141A18]">{gameMeta?.icon} {gameMeta?.title}</h3>
                    <button onClick={() => setRulesOpen(false)} className="icon-btn" aria-label="Zamknij">✕</button>
                  </div>

                  {game === 'makao' && (
                    <>
                      <div className="p-3.5 rounded-2xl bg-[#F6F3EC] border border-[#E2DDD2] text-xs text-[#141A18] font-semibold">
                        <p className="leading-relaxed">
                          Dokładaj kartę w tym samym <strong>kolorze</strong> albo o tej samej <strong>figurze</strong> co karta na stosie.
                          Nie masz ruchu? Dobierz kartę — jeśli pasuje, możesz ją od razu zagrać. Wygrywa ten, kto pierwszy pozbędzie się kart.
                        </p>
                        <div className="mt-2 divide-y divide-[#E2DDD2]">
                          {rules.multiPlay && (
                            <div className="rule-row">
                              <span className="rule-chip">7 7</span>

                            </div>
                          )}

                            <span className="rule-chip">2 · 3</span>

                              <span className="rule-chip">4</span>

                            <span>Walet żąda figury (5–10). Żądanie obowiązuje wszystkich przez jedną kolejkę.</span>

                          <div className="rule-row">
                            <span className="rule-chip">A</span>
                            <span>As zmienia kolor na dowolnie wybrany.</span>
                          </div>

                            <div className="rule-row">
                              <span className="rule-chip">K<span style={red}>♥</span> K♠</span>
                              <span>Król kier: następny gracz dobiera 5 kart. Król pik: 5 kart dobiera <strong>poprzedni</strong> gracz.</span>
                            </div>

                            <div className="rule-row">
                              <span className="rule-chip">Q</span>
                              <span>Dama na wszystko, wszystko na damę (poza karą, postojem i żądaniem waleta).</span>
                            </div>
                          )}

                            <div className="rule-row">
                              <span className="rule-chip">Q♠</span>
                              <span>Dama pik to tarcza — kasuje całą karę dobierania.</span>

                              <span className="rule-chip">★</span>

                            </div>

                      </div>

                          <p className="text-[11px] font-bold text-[#586560]">

                          ['skipFour', 'Czwórka = postój', 'Następny gracz traci kolejkę'],
                          ['warKings', 'Króle bojowe', 'Król ♥ i król ♠ dają +5 kart'],
                          ['queenAll', 'Dama na wszystko', 'I wszystko na damę'],

                          ['catchMakao', 'MAKAO i STOP MAKAO', 'Brak okrzyku + „STOP MAKAO!” rywala = 5 kart'],
                          ['queenSpadesShield', 'Tarcza damy pik', 'Wariant: dama ♠ kasuje karę'],

                              value={rules.turnTime}
                              disabled={!canEdit}
                              onChange={e => setRule('turnTime', Number(e.target.value))}
                              className="mt-1 w-full px-2.5 py-2 rounded-xl bg-[#F6F3EC] border border-[#E2DDD2] text-sm font-extrabold text-[#141A18]"
                            >
                              <option value={0}>Bez limitu</option>
                              <option value={30}>30 sekund</option>
                              <option value={60}>60 sekund</option>
                            </select>
                          </label>
                        </div>
                      </div>
                    </>
                  )}

                  {game === 'saboteur' && (

                      <ul className="p-3.5 rounded-2xl bg-[#F6F3EC] border border-[#E2DDD2] space-y-1.5 text-xs text-[#141A18] font-semibold list-disc pl-7">

                        <li><strong>Chytry Pies</strong> przeszkadza ślepymi zaułkami i łamaniem pazurów.</li>
                        <li><strong>Mapa Węchu</strong> pozwala podejrzeć jeden z trzech zakrytych celów.</li>

                          Tunele mogą się spotkać i wtedy korzystają z nich oba koty. Po prawej czeka 5 zakrytych celów: Złota Mysz (3 pkt), tłusta mysz (2), dwie myszki (po 1) i pusta pułapka.
                          Cel zdobywa kot, którego komin jest z nim połączony. Runda trwa do odkrycia wszystkich celów albo do końca kart, mecz to <strong>3 rundy</strong> — wygrywa suma punktów.
                          Złamany pazur zdejmiesz Kocimiętką albo odrzucając 2 karty.
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          {[
                            ['duel', 'Pojedynek o myszy'],
                            ['cat_vs_dog', 'Kot kontra Chytry Pies']

                            const rawVal = (room?.sabSettings || DEFAULT_SAB_SETTINGS).mode1v1;
                            const currentVal = rawVal === 'cat_vs_dog' ? 'cat_vs_dog' : 'duel';
                            return (
                              <button
                                key={val}
                                disabled={!canEdit}
                                onClick={() => {
                                  if (room) {
                                    commitRoomState(prev => ({ ...prev, sabSettings: { ...prev.sabSettings, mode1v1: val } }));
                                  }
                                  DEFAULT_SAB_SETTINGS.mode1v1 = val;
                                  setNowTick(Date.now());
                                }}
                                className={`py-2.5 px-2.5 rounded-xl font-extrabold border-[1.5px] text-xs ${
                                  currentVal === val ? 'bg-[#0B463C] text-white border-[#0B463C]' : 'bg-white border-[#E2DDD2]'
                                } ${canEdit ? '' : 'opacity-60'}`}
                              >
                                {lbl}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </>
                  )}

                  {game === 'rummy' && (
                    <ul className="p-3.5 rounded-2xl bg-[#F6F3EC] border border-[#E2DDD2] space-y-1.5 text-xs text-[#141A18] font-semibold list-disc pl-7">
                      <li>Na początku tury dobierz kartę z talii albo ze stosu odkrytego.</li>
                      <li>Wykładaj grupy (3–4 te same figury) lub sekwensy w jednym kolorze.</li>
                      <li>Pierwsze wyłożenie musi mieć co najmniej <strong>30 punktów</strong>.</li>
                      <li>Turę kończysz, odrzucając jedną kartę. Wygrywa ten, kto pierwszy pozbędzie się kart.</li>
                    </ul>
                  )}

                  <button onClick={() => setRulesOpen(false)} className="tactile-btn btn-emerald w-full py-3 text-sm">
                    Gotowe
                  </button>
                </div>
              </div>
            );
          })()}

          {/* QR Invite Modal */}
          {qrModalOpen && room && (
            <InviteQRModal
              roomCode={room.code}
              onClose={() => setQrModalOpen(false)}
              onCopyLink={handleCopyInviteLink}
              onNativeShare={handleNativeShare}
            />
          )}

          {/* Instalacja aplikacji (PWA) — instrukcja dopasowana do urządzenia */}
          {installOpen && (
            <div className="sheet-backdrop" onClick={() => setInstallOpen(false)}>
              <div className="sheet-panel space-y-4" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between">
                  <h3 className="font-serif-display text-xl font-black text-[#141A18]">📲 Zainstaluj aplikację</h3>
                  <button onClick={() => setInstallOpen(false)} className="icon-btn" aria-label="Zamknij">✕</button>
                </div>

                  <div className="p-3.5 rounded-2xl bg-[#FEF3C7] border border-[#FDE68A] text-xs text-[#78350F] font-semibold leading-relaxed">
                    Gra jest teraz otwarta jako <strong>plik z dysku</strong>, a taką wersję przeglądarka nie pozwala zainstalować.
                    Aplikację instaluje się ze strony internetowej (adres zaczynający się od <strong>https://</strong>) —
                    otwórz ją pod takim adresem i wróć do tego przycisku.

                    <p className="text-xs text-[#586560] font-semibold leading-relaxed">

                      <button onClick={handleInstallClick} className="tactile-btn btn-coral w-full py-3.5 text-sm">
                        Zainstaluj teraz
                      </button>
                    ) : PWA.isIOS() ? (
                      <ol className="p-3.5 rounded-2xl bg-[#F6F3EC] border border-[#E2DDD2] space-y-1.5 text-xs text-[#141A18] font-semibold list-decimal pl-8">
                        <li>Otwórz tę stronę w <strong>Safari</strong>.</li>
                        <li>Stuknij <strong>Udostępnij</strong> (kwadrat ze strzałką w górę).</li>
                        <li>Wybierz <strong>„Do ekranu początkowego”</strong> i potwierdź <strong>Dodaj</strong>.</li>
                      </ol>
                    ) : (
                      <ol className="p-3.5 rounded-2xl bg-[#F6F3EC] border border-[#E2DDD2] space-y-1.5 text-xs text-[#141A18] font-semibold list-decimal pl-8">
                        <li>Otwórz menu przeglądarki (<strong>⋮</strong> w prawym górnym rogu).</li>
                        <li>Wybierz <strong>„Zainstaluj aplikację”</strong> lub <strong>„Dodaj do ekranu głównego”</strong>.</li>
                        <li>Potwierdź — ikona pojawi się obok innych aplikacji.</li>
                      </ol>
                    )}
                  </>
                )}

                <button onClick={() => setInstallOpen(false)} className="tactile-btn btn-paper w-full py-2.5 text-xs">
                  Zamknij
                </button>
              </div>
            </div>
          )}

          {/* Gra ze znajomymi: załóż stół albo dołącz kodem */}
          {friendsOpen && (
            <div className="sheet-backdrop" onClick={() => setFriendsOpen(false)}>
              <div className="sheet-panel space-y-4" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between">
                  <h3 className="font-serif-display text-xl font-black text-[#141A18]">👥 Gra ze znajomymi</h3>
                  <button onClick={() => setFriendsOpen(false)} className="icon-btn" aria-label="Zamknij">✕</button>
                </div>

                {fbStatus === 'online' ? (
                  <>
                    <button
                      onClick={() => {
                        setFriendsOpen(false);
                        createOnlineRoom(selectedGame);
                      }}
                      className="tactile-btn btn-coral w-full py-3.5 px-4 text-sm justify-between"
                    >
                      <span>➕ Załóż stół</span>
                      <span className="text-[10px] font-extrabold uppercase bg-black/15 px-2.5 py-0.5 rounded-full">
                        {gamesCatalog.find(g => g.id === selectedGame)?.title}
                      </span>
                    </button>

                    <div className="flex items-center gap-3 text-[11px] font-extrabold uppercase tracking-wider text-[#586560]">
                      <span className="flex-1 h-px bg-[#E2DDD2]" />
                      <span>albo dołącz kodem</span>
                      <span className="flex-1 h-px bg-[#E2DDD2]" />
                    </div>

                    <form
                      onSubmit={e => {
                        e.preventDefault();
                        joinOnlineRoom();
                      }}
                      className="flex items-center gap-2"
                    >
                      <input
                        type="text"
                        inputMode="text"
                        autoCapitalize="characters"
                        autoComplete="off"
                        maxLength={4}
                        value={joinCodeInput}
                        onChange={e => setJoinCodeInput(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''))}
                        placeholder="KOD"
                        aria-label="Kod stołu"
                        className="flex-1 min-w-0 h-12 rounded-2xl bg-[#F6F3EC] border-[1.5px] border-[#D6D1C7] text-center font-mono-code text-lg font-black tracking-[0.3em] text-[#141A18] uppercase focus:outline-none focus:border-[#0B463C]"
                      />
                      <button type="submit" disabled={joinCodeInput.length < 4} className="tactile-btn btn-emerald h-12 px-5 text-sm">
                        Dołącz
                      </button>
                    </form>
                    <p className="text-[11px] text-[#586560] font-semibold text-center">

                    </p>
                  </>
                ) : fbStatus === 'connecting' ? (
