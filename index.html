                  {!room && (
                    <button className="menu-row" onClick={go(() => setProfileOpen(true))}>
                      <span className="menu-row-icon" style={{ padding: 0, border: 'none', background: 'transparent' }}>
                        <PlayerAvatar avatarId={avatarId} frameId={frameId} size={38} />
                      </span>
                      <span className="flex-1 min-w-0">
                        <span className="block text-sm font-extrabold text-[#141A18] truncate">{playerName}</span>
                        <span className="block text-[11px] font-semibold text-[#586560]">Zmień nick, awatar i tytuł</span>
                      </span>
                      <span className="text-[#B4AC9C] text-lg font-black" aria-hidden="true">›</span>
                    </button>
                  )}

                  <button className="menu-row" onClick={go(() => setRulesOpen(true))}>
                    <span className="menu-row-icon">📖</span>
                    <span className="flex-1 min-w-0">
                      <span className="block text-sm font-extrabold text-[#141A18]">Zasady gry</span>
                      <span className="block text-[11px] font-semibold text-[#586560] truncate">{gameTitle} — ściąga i warianty</span>
                    </span>
                    <span className="text-[#B4AC9C] text-lg font-black" aria-hidden="true">›</span>
                  </button>

                  <button className="menu-row" role="switch" aria-checked={!muted} onClick={toggleMute}>
                    <span className="menu-row-icon">{muted ? '🔇' : '🔊'}</span>
                    <span className="flex-1 min-w-0">
                      <span className="block text-sm font-extrabold text-[#141A18]">Dźwięk i wibracje</span>
                      <span className="block text-[11px] font-semibold text-[#586560]">{muted ? 'Wyłączone' : 'Włączone'}</span>
                    </span>
                    <span className={`switch ${muted ? '' : 'on'}`} />
                  </button>

                  <button className="menu-row" role="switch" aria-checked={audio.music} onClick={() => setAudio(a => ({ ...a, music: !a.music }))}>
                    <span className="menu-row-icon font-serif-display font-black text-[#0B463C]">♪</span>
                    <span className="flex-1 min-w-0">
                      <span className="block text-sm font-extrabold text-[#141A18]">Muzyka tła</span>
                      <span className="block text-[11px] font-semibold text-[#586560]">{audio.music ? 'Włączona' : 'Wyłączona'}</span>
                    </span>
                    <span className={`switch ${audio.music ? 'on' : ''}`} />
                  </button>

                  {room?.isOnline && (
                    <button className="menu-row" onClick={go(() => setQrModalOpen(true))}>
                      <span className="menu-row-icon">➕</span>
                      <span className="flex-1 min-w-0">
                        <span className="block text-sm font-extrabold text-[#141A18]">Zaproś gracza</span>
                        <span className="block text-[11px] font-semibold text-[#586560]">Kod stołu {room.code}, link lub kod QR</span>
                      </span>
                      <span className="text-[#B4AC9C] text-lg font-black" aria-hidden="true">›</span>
                    </button>
                  )}

                  {!isInstalled && (
                    <button className="menu-row" onClick={go(handleInstallClick)}>
                      <span className="menu-row-icon">📲</span>
                      <span className="flex-1 min-w-0">
                        <span className="block text-sm font-extrabold text-[#141A18]">Zainstaluj aplikację</span>
                        <span className="block text-[11px] font-semibold text-[#586560]">Ikona na ekranie głównym, gra bez internetu</span>
                      </span>
                      <span className="text-[#B4AC9C] text-lg font-black" aria-hidden="true">›</span>
                    </button>
                  )}

                  {room && (
                    <button className="menu-row" style={{ background: '#FFF1EE', borderColor: '#F3C6BE' }} onClick={go(requestLeave)}>
                      <span className="menu-row-icon" style={{ borderColor: '#F3C6BE' }}>🚪</span>
                      <span className="flex-1 min-w-0">
                        <span className="block text-sm font-extrabold text-[#B91C1C]">{screen === 'game' ? 'Wyjdź z gry' : 'Opuść stół'}</span>
                        <span className="block text-[11px] font-semibold text-[#586560]">Powrót do menu głównego</span>
                      </span>
                    </button>
                  )}
                </div>
              </div>
            );
          })()}

          {dealing && (
            <div className="deal-layer" aria-hidden="true">
              {Array.from({ length: 14 }).map((_, i) => (
                <span
                  key={i}
                  className="deal-card"
                  style={{
                    '--d': `${i * 0.045}s`,
                    '--x': `${Math.round((Math.sin(i * 1.7) * 0.5 + 0.5 - 0.5) * 240)}px`,
                    '--y': `${Math.round(-40 + (Math.cos(i * 2.3) * 0.5 + 0.5) * 60)}px`,
                    '--r': `${Math.round(Math.sin(i * 3.1) * 28)}deg`,
                    background: i % 3 === 0 ? 'linear-gradient(160deg,#FF8A65,#E8455F)' : i % 3 === 1 ? 'linear-gradient(160deg,#F7D27A,#D08A2E)' : 'linear-gradient(160deg,#6EE7B7,#1E9A74)'
                  }}
                />
              ))}
            </div>
          )}

          {celebration && <Confetti seed={celebration.id} />}

          {/* Wybuchy emotek nad stołem */}
          {bursts.map(b => (
            <div key={b.id} className="emoji-burst" aria-hidden="true">
              {b.bits.map(bit => (
                <span
                  key={bit.key}
                  style={{
                    left: `${bit.left}%`,
                    fontSize: bit.size,
                    animationDelay: `${bit.delay}s`,
                    '--drift': `${bit.drift}px`,
                    '--spin': `${bit.spin}deg`
                  }}
                >
                  {b.emoji}
                </span>
              ))}
            </div>
          ))}

          {/* Zaczepka: czym rzucić w gracza */}
          {pokeTarget && (
            <div className="sheet-backdrop" onClick={() => setPokeTarget(null)}>
              <div className="sheet-panel space-y-3" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <PlayerAvatar avatarId={pokeTarget.avatarId} frameId={pokeTarget.frameId} size={40} />
                    <div className="min-w-0">
                      <h3 className="font-serif-display text-lg font-black text-[#141A18] leading-tight truncate">Zaczep: {pokeTarget.name}</h3>
                      <span className="text-[11px] font-bold text-[#586560]">Wszyscy przy stole to zobaczą 😈</span>
                    </div>
                  </div>
                  <button onClick={() => setPokeTarget(null)} className="icon-btn" aria-label="Zamknij">✕</button>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {CHAT_THROWS.map(item => (
                    <button
                      key={item.emoji}
                      onClick={() => throwAt(pokeTarget, item)}
                      className="tactile-btn btn-paper flex-col py-3 gap-1"
                    >
                      <span className="text-3xl leading-none">{item.emoji}</span>
                      <span className="text-[11px] font-extrabold">{item.label}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Potwierdzenie wyjścia z trwającej partii */}
          {leaveConfirmOpen && (
            <div className="sheet-backdrop" onClick={() => setLeaveConfirmOpen(false)}>
              <div className="sheet-panel text-center space-y-4" onClick={e => e.stopPropagation()}>
                <div>
                  <h3 className="font-serif-display text-xl font-black text-[#141A18]">Wyjść z gry?</h3>
                  <p className="text-xs text-[#586560] font-semibold mt-1">
                    {room?.isOnline ? 'Opuścisz stół, a pozostali gracze będą grać dalej bez Ciebie.' : 'Ta partia zostanie przerwana.'}
                  </p>
                </div>
                <div className="grid grid-cols-2 gap-2.5">
                  <button onClick={() => setLeaveConfirmOpen(false)} className="tactile-btn btn-emerald py-3 text-sm">
                    Gram dalej
                  </button>
                  <button onClick={leaveRoom} className="tactile-btn btn-paper py-3 text-sm">
                    Wyjdź
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Czat przy stole */}
          {chatOpen && (
            <div className="sheet-backdrop" onClick={closeChat}>
              <div className="sheet-panel flex flex-col" style={{ height: 'min(78dvh, 560px)', overflow: 'hidden' }} onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between pb-2.5 border-b border-[#E2DDD2]">
                  <div>
                    <h3 className="font-serif-display text-xl font-black text-[#141A18] leading-tight">💬 Czat przy stole</h3>
                    <span className="text-[11px] font-bold text-[#586560]">
                      {room?.isOnline
                        ? `${room.players.filter(p => !p.isBot).length} ${room.players.filter(p => !p.isBot).length === 1 ? 'osoba' : 'osoby'} przy stole`
                        : 'Boty mają cięty język — zaczep je 😼'}
                    </span>
                  </div>
                  <button onClick={closeChat} className="icon-btn" aria-label="Zamknij czat">✕</button>
                </div>

                <div ref={chatListRef} className="flex-1 overflow-y-auto custom-scroll space-y-2 py-3 min-h-0">
                  {messages.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-center gap-1 text-[#586560]">
                      <span className="text-3xl">🐾</span>
                      <span className="text-xs font-bold">Cisza przy stole. Zagadaj, wyślij emotkę albo stuknij gracza przy stole i rzuć w niego kapciem 🩴</span>
                    </div>
                  ) : (
                    messages.map((m, i) => {
                      const mine = m.senderId === playerId;
                      const sameAsPrev = i > 0 && messages[i - 1].senderId === m.senderId;
                      const bigEmoji = CHAT_REACTIONS.includes(m.text);
                      return (
                        <div key={m.id} className={`flex items-end gap-2 ${mine ? 'flex-row-reverse' : ''} ${sameAsPrev ? '' : 'pt-1'}`}>
                          <div style={{ width: 28, visibility: sameAsPrev ? 'hidden' : 'visible' }} className="flex-shrink-0">
                            <PlayerAvatar avatarId={m.avatarId} frameId={m.frameId} size={28} />
                          </div>
                          <div className={`max-w-[76%] ${mine ? 'text-right' : ''}`}>
                            {!mine && !sameAsPrev && (
                              <span className="text-[10px] font-extrabold text-[#586560] px-1">{m.senderName}</span>
                            )}
                            {bigEmoji ? (
                              <div className="text-3xl leading-none py-0.5">{m.text}</div>
                            ) : (
                              <div
                                className={`inline-block text-left px-3 py-2 text-[13px] font-semibold leading-snug break-words ${
                                  mine
                                    ? 'bg-[#0B463C] text-white rounded-2xl rounded-br-md'
                                    : 'bg-[#F0EDE6] text-[#141A18] rounded-2xl rounded-bl-md'
                                }`}
                                style={{ userSelect: 'text' }}
                              >
                                {m.text}
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                {/* Reakcje i gotowe teksty */}
                <div className="flex items-center gap-1.5 overflow-x-auto pt-2 pb-2 border-t border-[#E2DDD2]" style={{ scrollbarWidth: 'none' }}>
                  {CHAT_REACTIONS.map(r => (
                    <button
                      key={r}
                      onClick={() => sendChatMessage(r)}
                      className="w-10 h-10 rounded-2xl bg-[#F6F3EC] border border-[#E2DDD2] text-xl flex-shrink-0 active:scale-90 transition"
                      aria-label={`Wyślij reakcję ${r}`}
                    >
                      {r}
                    </button>
                  ))}
                  <span className="w-px h-6 bg-[#E2DDD2] flex-shrink-0 mx-0.5" />
                  {[...(CHAT_PHRASES[room?.gameType] || []), ...CHAT_PHRASES.common].map(phrase => (
                    <button
                      key={phrase}
                      onClick={() => sendChatMessage(phrase)}
                      className="px-3 h-10 rounded-2xl bg-[#F6F3EC] border border-[#E2DDD2] text-xs font-bold whitespace-nowrap flex-shrink-0 text-[#141A18]"
                    >
                      {phrase}
                    </button>
                  ))}
                </div>

                <form
                  onSubmit={e => {
                    e.preventDefault();
                    sendChatMessage(chatInput);
                  }}
                  className="flex gap-2"
                >
                  <input
                    type="text"
                    value={chatInput}
                    maxLength={140}
                    onChange={e => setChatInput(e.target.value)}
                    placeholder="Napisz… (/reset wznawia bota)"
                    aria-label="Treść wiadomości"
                    enterKeyHint="send"
                    className="flex-1 min-w-0 px-4 h-11 rounded-2xl bg-[#F6F3EC] border-[1.5px] border-[#E2DDD2] text-sm font-semibold focus:outline-none focus:border-[#0B463C]"
                  />
                  <button type="submit" disabled={!chatInput.trim()} className="tactile-btn btn-coral px-4 text-sm" aria-label="Wyślij">
                    ➤
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
